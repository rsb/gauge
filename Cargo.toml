[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
rsb-gauge-reconcile = { path = "crates/rsb-gauge-reconcile" }
rsb-gauge-schema = { path = "crates/rsb-gauge-schema" }
rsb-gauge-store = { path = "crates/rsb-gauge-store" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
libc = "0.2"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
# Bundled, so every machine runs the same SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1"
ureq = { version = "3", features = ["json"] }

# The layer table read by `cargo xtask layers`. A crate depends only on crates
# in strictly lower layers. See engineering/layers.md.
[workspace.metadata.layers]
rsb-gauge-schema = 0
rsb-gauge-reconcile = 1
rsb-gauge-store = 2
rsb-gauge-cli = "exempt"
agent-driver = "exempt"
xtask = "exempt"

# The custody table, also read by `cargo xtask layers`. Only `holder` depends
# on these crates, and no crate depends on `holder`. `transitive` counts at any
# depth; `direct` only where a crate lists it itself, for crates that every
# async runtime and socket library links. See engineering/layers.md.
[workspace.metadata.custody]
holder = "agent-driver"
transitive = [
    # GitHub clients and the App JWT signer.
    "jsonwebtoken",
    "octocrab",
    # HTTP clients.
    "attohttpc",
    "curl",
    "hyper",
    "isahc",
    "reqwest",
    "ureq",
    # Process launchers.
    "duct",
    "subprocess",
]
# Process launchers through the C library.
direct = ["libc", "nix"]

# Never crash and errors, engineering/never-crash.md and engineering/errors.md.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
