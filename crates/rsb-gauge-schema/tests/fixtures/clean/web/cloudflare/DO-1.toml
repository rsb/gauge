id = "DO-1"
statement = "Treat a Durable Object's method as its unit of work. Await only its storage."
why = "The object runs one event at a time and holds itself for a method that awaits only storage."
check_class = "heuristic"
default_level = "warn"

[scope]
tree = "rsb/web/cloudflare"
toolchain = "typescript"
runtime = "cloudflare"
paths = ["packages/data/**/src/**", "apps/auth/src/**"]

[lifecycle]
state = "trial"
since = "2026-10-19"

[[checks]]
kind = "ast-grep"
ref = "checks/do-awaits-only-storage.yml"
precision = 0.8
